<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>한해농사 · 호두나무 사과대추</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c0b; --ink:#f2efe6; --muted:#8d958c; --muted2:#6b736a;
    --gold:#cbb079; --gold-bright:#ecd9a8; --gold-deep:#9a8048;
    --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.07);
    --line:rgba(203,176,121,.16); --line-strong:rgba(203,176,121,.34);
    --green:#62b489; --blue:#6ea7df; --amber:#d6b46a; --violet:#a99bd6; --red:#e08a72;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:"Noto Sans KR",-apple-system,sans-serif; color:var(--ink); font-size:16px; line-height:1.7;
    background:
      radial-gradient(120% 80% at 50% -10%, #16201a 0%, rgba(22,32,26,0) 55%),
      radial-gradient(90% 60% at 90% 110%, #1a1812 0%, rgba(26,24,18,0) 50%), #0a0c0b;
    background-attachment:fixed; min-height:100vh;
  }
  .app{ max-width:460px; margin:0 auto; min-height:100vh; position:relative; padding:0 20px 120px; }

  .topbar{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
    padding:18px 0 14px; background:linear-gradient(180deg,var(--bg) 62%, rgba(10,12,11,0)); }
  .topbar.hide{ display:none; }
  .iconbtn{ width:42px; height:42px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    border-radius:13px; border:1px solid var(--line); background:var(--glass); color:var(--gold-bright);
    font-size:19px; cursor:pointer; backdrop-filter:blur(10px); transition:.15s; }
  .iconbtn:active{ transform:scale(.92); background:var(--glass-2); }
  .crumb{ flex:1; min-width:0; }
  .crumb .t1{ font-size:11px; letter-spacing:.22em; color:var(--gold); text-transform:uppercase; font-weight:700; }
  .crumb .t2{ font-family:"Noto Serif KR",serif; font-size:18px; font-weight:700; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }

  .hero{ text-align:center; padding:42px 8px 26px; }
  .hero .mono{ font-family:"Cormorant Garamond",serif; font-size:13px; letter-spacing:.5em; font-weight:600;
    color:var(--gold); text-transform:uppercase; margin-bottom:20px; }
  .hero .seal{ width:64px; height:64px; margin:0 auto 22px; border-radius:50%;
    border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center;
    font-size:30px; background:radial-gradient(circle at 50% 30%, rgba(203,176,121,.18), rgba(203,176,121,0));
    box-shadow:0 0 0 6px rgba(203,176,121,.05), inset 0 1px 0 rgba(255,255,255,.06); }
  .hero h1{ font-family:"Noto Serif KR",serif; font-weight:900; font-size:33px; line-height:1.32; margin:0; letter-spacing:-.5px; }
  .hero h1 .amp{ color:var(--gold); font-family:"Cormorant Garamond",serif; font-weight:600; padding:0 4px; font-size:34px; }
  .hero .sub{ margin-top:14px; color:var(--muted); font-size:13.5px; letter-spacing:.14em; font-weight:300; }
  .hairline{ width:42px; height:1px; margin:24px auto 0; background:linear-gradient(90deg,transparent,var(--gold-deep),transparent); }

  .eyebrow{ font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:6px 4px 16px; }

  .tile{ position:relative; display:flex; align-items:center; gap:16px; width:100%; cursor:pointer;
    text-align:left; border:1px solid var(--line); border-radius:20px; padding:20px;
    background:var(--glass); backdrop-filter:blur(14px); color:var(--ink); margin-bottom:14px; transition:.18s; overflow:hidden; }
  .tile::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold-deep)); opacity:0; transition:.18s; }
  .tile:active{ transform:scale(.985); background:var(--glass-2); }
  .tile:active::before{ opacity:1; }
  .tile .ic{ width:52px; height:52px; flex:0 0 auto; border-radius:15px; display:flex; align-items:center; justify-content:center;
    font-size:27px; border:1px solid var(--line); background:rgba(0,0,0,.25); }
  .tile .tx .nm{ font-family:"Noto Serif KR",serif; font-size:21px; font-weight:700; letter-spacing:-.2px; }
  .tile .tx .ds{ font-size:12.5px; color:var(--muted); margin-top:3px; letter-spacing:.02em; }
  .tile .go{ margin-left:auto; color:var(--gold); font-size:18px; opacity:.7; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .cat{ position:relative; cursor:pointer; border:1px solid var(--line); border-radius:22px;
    background:var(--glass); backdrop-filter:blur(14px); padding:24px 18px 20px; text-align:left;
    color:var(--ink); transition:.18s; overflow:hidden; min-height:148px; display:flex; flex-direction:column; }
  .cat:active{ transform:scale(.97); }
  .cat .glow{ position:absolute; top:-30px; right:-30px; width:110px; height:110px; border-radius:50%; filter:blur(34px); opacity:.5; }
  .cat .badge{ width:50px; height:50px; border-radius:15px; display:flex; align-items:center; justify-content:center;
    font-size:25px; border:1px solid var(--line-strong); background:rgba(0,0,0,.3); margin-bottom:auto; }
  .cat .nm{ font-family:"Noto Serif KR",serif; font-size:19px; font-weight:700; margin-top:16px; }
  .cat .ds{ font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .cat.c-bibi .glow{ background:var(--green); } .cat.c-bangje .glow{ background:var(--blue); }
  .cat.c-jeonji .glow{ background:var(--amber); } .cat.c-etc .glow{ background:var(--violet); }
  .cat.c-bibi .badge{ color:var(--green); } .cat.c-bangje .badge{ color:var(--blue); }
  .cat.c-jeonji .badge{ color:var(--amber); } .cat.c-etc .badge{ color:var(--violet); }

  .months{ display:flex; gap:9px; overflow-x:auto; padding:4px 20px 14px; margin:0 -20px;
    scrollbar-width:none; -ms-overflow-style:none; scroll-snap-type:x proximity; }
  .months::-webkit-scrollbar{ display:none; }
  .mbtn{ flex:0 0 auto; scroll-snap-align:center; cursor:pointer; border:1px solid var(--line);
    background:var(--glass); color:var(--muted); border-radius:13px; padding:11px 15px; font-size:14px; font-weight:700;
    transition:.16s; white-space:nowrap; }
  .mbtn:active{ transform:scale(.94); }
  .mbtn.active{ color:#16140d; background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    border-color:transparent; box-shadow:0 6px 18px -6px rgba(203,176,121,.5); }
  .mbtn.mix{ color:var(--gold-bright); border-color:var(--line-strong); }
  .mbtn.mix.active{ color:#16140d; }

  .panel{ animation:rise .32s cubic-bezier(.2,.7,.3,1); }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  .ccard{ position:relative; border:1px solid var(--line); border-radius:22px; padding:24px 22px;
    background:linear-gradient(180deg,var(--glass-2),var(--glass)); backdrop-filter:blur(16px);
    box-shadow:0 24px 50px -30px rgba(0,0,0,.9); }
  .ccard .mhead{ display:flex; align-items:baseline; gap:12px; padding-bottom:16px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .ccard .mhead .mm{ font-family:"Noto Serif KR",serif; font-size:30px; font-weight:900; color:var(--gold-bright); line-height:1; }
  .ccard .mhead .ss{ font-size:12.5px; color:var(--muted); font-weight:500; letter-spacing:.02em; }
  .ccard .body{ font-size:15.5px; color:#ddd9cd; }
  .ccard .body strong{ color:var(--gold-bright); font-weight:700; }
  .ccard .body b{ color:var(--ink); }
  .ccard.skip{ background:rgba(255,255,255,.025); border-style:dashed; }
  .ccard.skip .mm{ color:var(--muted); } .ccard.skip .body{ color:var(--muted); }
  .ccard.warn{ border-color:rgba(224,138,114,.4); }
  .ccard.warn::after{ content:""; position:absolute; left:0; top:22px; bottom:22px; width:3px; border-radius:3px;
    background:linear-gradient(180deg,var(--red),#b85a42); }
  .ccard.warn .mm{ color:var(--red); } .ccard.warn .body strong{ color:var(--red); }

  .pill{ display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--gold-bright);
    border:1px solid var(--line-strong); border-radius:100px; padding:3px 11px; margin-bottom:14px; }
  .notice{ border:1px solid rgba(214,180,106,.3); border-radius:18px; padding:16px 18px; margin-bottom:14px;
    font-size:13.5px; color:#e7dcc4; background:rgba(214,180,106,.06); line-height:1.65; }
  .notice b{ color:var(--gold-bright); font-weight:700; }
  .mtable{ width:100%; border-collapse:separate; border-spacing:0; font-size:13px; margin-top:6px;
    border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .mtable th,.mtable td{ padding:11px 13px; text-align:left; border-bottom:1px solid var(--line); }
  .mtable th{ background:rgba(203,176,121,.1); color:var(--gold-bright); font-weight:700; font-size:11.5px; letter-spacing:.04em; }
  .mtable tr:last-child td{ border-bottom:none; }
  .mtable td:first-child{ color:var(--ink); font-weight:700; }

  .dash-btn{ background:linear-gradient(135deg,rgba(203,176,121,.16),rgba(203,176,121,.05)); border-color:var(--line-strong); }
  .dash-btn .ic{ background:rgba(203,176,121,.14); color:var(--gold-bright); }
  #dash-seg{ display:flex; gap:8px; margin:0 0 18px; }
  #dash-seg .seg{ flex:1; cursor:pointer; border:1px solid var(--line); background:var(--glass); color:var(--muted);
    border-radius:14px; padding:13px; font-family:"Noto Serif KR",serif; font-weight:700; font-size:15px; transition:.16s; }
  #dash-seg .seg:active{ transform:scale(.97); }
  #dash-seg .seg.active{ color:#16140d; background:linear-gradient(135deg,var(--gold-bright),var(--gold)); border-color:transparent;
    box-shadow:0 6px 18px -6px rgba(203,176,121,.5); }
  .drow{ border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-bottom:12px;
    background:linear-gradient(180deg,var(--glass-2),var(--glass)); backdrop-filter:blur(14px); }
  .drow.now{ border-color:var(--line-strong); box-shadow:0 0 0 1px var(--line-strong), 0 14px 34px -20px rgba(203,176,121,.55); }
  .drow .dm{ display:flex; align-items:baseline; gap:10px; padding-bottom:11px; margin-bottom:9px; border-bottom:1px solid var(--line); }
  .drow .dmm{ font-family:"Noto Serif KR",serif; font-size:21px; font-weight:900; color:var(--gold-bright); line-height:1; }
  .drow.now .dmm::after{ content:" · 이번 달"; font-family:"Noto Sans KR",sans-serif; font-size:10.5px; color:var(--gold); font-weight:700; letter-spacing:.04em; }
  .drow .dss{ font-size:11.5px; color:var(--muted); }
  .dt{ display:flex; gap:11px; align-items:flex-start; padding:5px 0; }
  .dl{ flex:0 0 52px; font-size:12px; font-weight:700; padding-top:1px; }
  .dl.bibi{ color:var(--green); } .dl.bangje{ color:var(--blue); } .dl.jeonji{ color:var(--amber); }
  .dv{ font-size:14px; color:#ddd9cd; line-height:1.55; }
  .dv.warn{ color:var(--red); font-weight:700; }
  .dv.off{ color:var(--muted2); }
  footer{ text-align:center; font-size:11px; color:var(--muted2); margin-top:34px; letter-spacing:.14em; }
  footer .g{ color:var(--gold); }
  .hidden{ display:none; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar hide" id="topbar">
    <button class="iconbtn" id="backbtn" aria-label="back">‹</button>
    <div class="crumb"><div class="t1" id="crumb1">Annual Calendar</div><div class="t2" id="crumb2"></div></div>
  </div>

  <div id="screen-home">
    <div class="hero">
      <div class="mono">Annual Farming Calendar</div>
      <div class="seal">🌿</div>
      <h1>호두나무<span class="amp">&</span>사과대추<br>한 해 농사</h1>
      <div class="sub">2026 · 거름 · 농약 · 가지치기</div>
      <div class="hairline"></div>
    </div>
    <div class="eyebrow">Dashboard · 대시보드</div>
    <button class="tile dash-btn" onclick="openDash()">
      <div class="ic">📊</div>
      <div class="tx"><div class="nm">한눈에 보는 1년</div><div class="ds">시비 · 방제 · 전지 월별 핵심 요약</div></div>
      <div class="go">›</div>
    </button>
    <div class="eyebrow" style="margin-top:26px">Select Tree · 나무 선택</div>
    <button class="tile" onclick="selectTree('walnut')">
      <div class="ic">🌰</div>
      <div class="tx"><div class="nm">호두나무</div><div class="ds">시비 · 방제 · 전지 · 기타</div></div>
      <div class="go">›</div>
    </button>
    <button class="tile" onclick="selectTree('jujube')">
      <div class="ic">🍎</div>
      <div class="tx"><div class="nm">사과대추</div><div class="ds">시비 · 방제 · 전지 · 물·수확</div></div>
      <div class="go">›</div>
    </button>
    <footer>2026 한해농사 달력 · 3년생 50주 기준 · <span class="g">유재진</span></footer>
  </div>

  <div id="screen-cat" class="hidden">
    <div class="eyebrow" id="cat-eyebrow">Select Task · 작업 선택</div>
    <div class="grid">
      <button class="cat c-bibi" onclick="selectCat('bibi')"><span class="glow"></span>
        <span class="badge">🌱</span><span class="nm">시비</span><span class="ds">거름주기<br>밑·웃·잎거름</span></button>
      <button class="cat c-bangje" onclick="selectCat('bangje')"><span class="glow"></span>
        <span class="badge">💊</span><span class="nm">방제</span><span class="ds">농약치기<br>배합·살포</span></button>
      <button class="cat c-jeonji" onclick="selectCat('jeonji')"><span class="glow"></span>
        <span class="badge">✂️</span><span class="nm">전지</span><span class="ds">가지치기<br>수형·순지르기</span></button>
      <button class="cat c-etc" onclick="selectCat('etc')"><span class="glow"></span>
        <span class="badge">📌</span><span class="nm">기타</span><span class="ds">물·수확<br>갈무리·관리</span></button>
    </div>
  </div>

  <div id="screen-month" class="hidden">
    <div class="months" id="months"></div>
    <div class="panel" id="panel"></div>
  </div>

  <div id="screen-dash" class="hidden">
    <div class="eyebrow">한눈에 보는 1년 · 월별 핵심</div>
    <div id="dash-seg">
      <button class="seg" data-t="walnut" onclick="setDashTree('walnut')">🌰 호두나무</button>
      <button class="seg" data-t="jujube" onclick="setDashTree('jujube')">🍎 사과대추</button>
    </div>
    <div class="panel" id="dash-body"></div>
  </div>

</div>

<script>
const TREE_NAME={ walnut:"호두나무", jujube:"사과대추" };
const TREE_ICON={ walnut:"🌰", jujube:"🍎" };
const CAT_NAME={ bibi:"시비 · 거름주기", bangje:"방제 · 농약치기", jeonji:"전지 · 가지치기", etc:"기타 · 관리" };

const DATA = {
walnut: {
  bibi: [
    {m:"1~2월", s:"겨울 — 나무가 잠자는 시기", skip:true, b:"이번 달은 거름을 주지 않습니다. (땅이 얼어 있어 효과 없음)"},
    {m:"3월", s:"봄 시작 — 밑거름 주는 달", b:"<strong>밑거름</strong> · 완전히 썩은 퇴비(소똥·계분 등 완숙 퇴비)<br>· 양: 200평당 3,000~4,000kg / 나무 1그루당 30~40kg<br>· 가지 끝이 닿는 땅에 빙 둘러 5cm 골을 파고 → 퇴비 넣고 → 흙 덮기<br>· 1년에 1번 (가을에 줬다면 봄 생략 가능)"},
    {m:"4월", s:"싹 트는 달 — 어린나무 영양 보충", b:"<strong>미량요소 보충</strong> · 미량요소 복합비료(아연·구리·망간)<br>· 1㎡당 10~15g (종이컵 1/10)<br>· 나무 주변 땅에 골고루 뿌리고 물 주기 · 싹 틀 무렵 1번"},
    {m:"5월", s:"꽃 피는 달", b:"<strong>어린나무만</strong> · 요소 비료(어린나무·묘목만)<br>· 1㎡당 15g(밥숟가락 1개) · 줄기에서 한 뼘 떨어뜨려 주기<br>· 어린 싹에 직접 닿으면 타 버립니다"},
    {m:"6월", s:"열매 굵어지는 달 — 웃거름", b:"<strong>웃거름</strong> · 인산·칼륨 복합비료(질소 적은 것, 예 0-20-20)<br>· 큰 나무 1그루당 한 줌 가득(약 100g)<br>· 가지 끝 닿는 땅에 5cm 골 파고 묻기 · 6월 초 1번"},
    {m:"7월", s:"장마철 — 웃거름 2차 + 잎거름", b:"<strong>땅거름</strong> 인산·칼륨, 1그루당 한 줌(7월 중순 1번)<br><strong>잎거름</strong> 제일인산칼륨을 물 20L에 40~60g(0.2~0.3%) 타서 잎 앞뒤로<br>· 아침 이슬 마른 뒤, 오전 10시 전"},
    {m:"8월", s:"열매 익는 달 — 잎거름 2차", warn:true, b:"<strong>잎거름</strong> 인산칼륨 물 20L에 40~60g (7월에 이어 2번째)<br>★ <strong>8월부터 질소 비료(요소 등) 절대 금지!</strong> 새 가지가 나와 겨울에 얼어 죽습니다"},
    {m:"9월", s:"수확의 달 — 가을거름", b:"<strong>가을거름</strong> · 칼륨·인산 비료<br>· 큰 나무 1그루당 한 줌 조금 안 되게(80g)<br>· 가지 끝 닿는 땅에 골 파고 묻기 · 9월 상순 1번 · 지친 나무 기운 보충"},
    {m:"10월", s:"수확 마무리 — 밑거름", b:"<strong>밑거름(내년 준비)</strong> · 완숙 퇴비<br>· 200평당 3,000kg / 나무 1그루당 30kg<br>· 가지 끝 닿는 땅에 골 파고 묻기 · 겨우내 삭아 내년 봄 새싹의 밥"},
    {m:"11~12월", s:"겨울 채비", skip:true, b:"10월에 밑거름을 줬다면 끝. 안 줬다면 땅 얼기 전(12월 중순 전)에 주세요."}
  ],
  bangje: [
    {m:"1~2월", s:"겨울", skip:true, b:"이번 달은 농약을 치지 않습니다."},

let curTree=null, curCat=null, dashTree='walnut';
const CUR_MONTH=new Date().getMonth()+1;
function openDash(){ setBar(true,"Annual Calendar","📊 한눈에 보는 1년"); renderDash(); show("screen-dash"); }
function setDashTree(t){ dashTree=t; renderDash(); }
function renderDash(){
  document.querySelectorAll("#dash-seg .seg").forEach(b=>b.classList.toggle("active", b.dataset.t===dashTree));
  let html="";
  DASH[dashTree].forEach(r=>{
    const now=monthMatches(r.m,CUR_MONTH);
    const cell=(v,w)=> v==="휴식"||v.indexOf("끝")===0 ? `<span class="dv off">${v}</span>` : `<span class="dv ${w?'warn':''}">${v}</span>`;
    html+=`<div class="drow${now?' now':''}"><div class="dm"><span class="dmm">${r.m}</span><span class="dss">${r.s}</span></div>
      <div class="dt"><span class="dl bibi">🌱 시비</span>${cell(r.bibi,r.bibiW)}</div>
      <div class="dt"><span class="dl bangje">💊 방제</span>${cell(r.bangje,r.bangjeW)}</div>
      <div class="dt"><span class="dl jeonji">✂️ 전지</span>${cell(r.jeonji,r.jeonjiW)}</div></div>`;
  });
  document.getElementById("dash-body").innerHTML=html;
}
function monthMatches(label,mnum){
  const r=label.match(/^(\d+)~(\d+)월$/);
  if(r) return mnum>=+r[1] && mnum<=+r[2];
  const s=label.match(/^(\d+)월$/);
  return s && +s[1]===mnum;
}
function show(id){
  ["screen-home","screen-cat","screen-month","screen-dash"].forEach(s=>document.getElementById(s).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo({top:0,behavior:"instant"});
}
function setBar(on,t1,t2){
  const b=document.getElementById("topbar");
  if(on){ b.classList.remove("hide"); document.getElementById("crumb1").textContent=t1; document.getElementById("crumb2").textContent=t2; }
  else b.classList.add("hide");
}
function selectTree(t){
  curTree=t;
  document.getElementById("cat-eyebrow").textContent="Select Task · "+TREE_NAME[t]+" 작업";
  setBar(true,"Annual Calendar",TREE_ICON[t]+" "+TREE_NAME[t]);
  show("screen-cat");
}
function selectCat(c){
  curCat=c; setBar(true,TREE_NAME[curTree],CAT_NAME[c]); buildMonths(); show("screen-month");
}
function buildMonths(){
  const arr=DATA[curTree][curCat]; const wrap=document.getElementById("months");
  let html=""; let defIdx=0, found=false;
  if(curCat==='bangje') html+=`<button class="mbtn mix" data-idx="-1">💊 배합법</button>`;
  arr.forEach((it,i)=>{
    if(!found && monthMatches(it.m,CUR_MONTH)){ defIdx=i; found=true; }
    html+=`<button class="mbtn" data-idx="${i}">${it.m}</button>`;
  });
  wrap.innerHTML=html;
  wrap.querySelectorAll(".mbtn").forEach(b=>b.addEventListener("click",()=>selectMonth(+b.dataset.idx)));
  selectMonth(defIdx);
}
function selectMonth(idx){
  document.querySelectorAll("#months .mbtn").forEach(b=>b.classList.toggle("active",+b.dataset.idx===idx));
  const p=document.getElementById("panel"); let html="";
  if(idx===-1){ html=`<div class="panel">${MIX[curTree]}</div>`; }
  else{
    const it=DATA[curTree][curCat][idx];
    const cls=it.warn?"ccard warn":(it.skip?"ccard skip":"ccard");
    html=`<div class="panel"><div class="${cls}"><div class="mhead"><span class="mm">${it.m}</span><span class="ss">${it.s||""}</span></div><div class="body">${it.b}</div></div></div>`;
  }
  p.innerHTML=html;
  const act=document.querySelector("#months .mbtn.active");
  if(act) act.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}
document.getElementById("backbtn").addEventListener("click",()=>{
  const monthVisible=!document.getElementById("screen-month").classList.contains("hidden");
  if(monthVisible){ setBar(true,"Annual Calendar",TREE_ICON[curTree]+" "+TREE_NAME[curTree]); show("screen-cat"); }
  else { setBar(false); show("screen-home"); }
});
